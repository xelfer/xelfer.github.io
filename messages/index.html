<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Nick — Sydney Marathon</title>
<style>
  :root {
    --strava: #fc4c02;
    --gold: #f9c74f;
    --win: #90be6d;
    --bg: #0e0e0e;
    --card: #1a1a1a;
    --border: rgba(255,255,255,0.1);
    --text: #f0f0f0;
    --dim: #888;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  h1 {
    margin: 0 0 0.5rem 0;
    font-size: 1.6rem;
    background: linear-gradient(90deg, var(--strava), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--dim); margin: 0 0 1.5rem 0; font-size: 0.95rem; }
  label { display: block; color: var(--dim); font-size: 0.85rem; margin: 1rem 0 0.4rem 0; }
  input, textarea {
    width: 100%;
    padding: 0.75rem 0.9rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--gold); }
  .charcount { color: var(--dim); font-size: 0.75rem; text-align: right; margin-top: 0.2rem; }
  button {
    margin-top: 1.5rem;
    width: 100%;
    padding: 0.9rem;
    background: var(--strava);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:active { transform: scale(0.98); }
  #status {
    margin-top: 1rem;
    padding: 0.75rem;
    border-radius: 8px;
    font-size: 0.9rem;
    text-align: center;
    display: none;
  }
  #status.ok { display: block; background: rgba(144,190,109,0.15); color: var(--win); border: 1px solid rgba(144,190,109,0.4); }
  #status.err { display: block; background: rgba(252,76,2,0.15); color: var(--strava); border: 1px solid rgba(252,76,2,0.4); }
  .footer { margin-top: 1.5rem; color: var(--dim); font-size: 0.8rem; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <h1>Message Nick</h1>
    <p class="subtitle">Send him a note — he'll hear it in his headphones during the Sydney Marathon.</p>

    <label for="sender">Your name</label>
    <input id="sender" type="text" maxlength="40" placeholder="Kim" autocomplete="name">

    <label for="message">Message</label>
    <textarea id="message" maxlength="180" rows="3" placeholder="Go Dad! We're proud of you!"></textarea>
    <div class="charcount"><span id="count">0</span> / 180</div>

    <button id="send">Send message</button>
    <div id="status"></div>

    <p class="footer">
      Messages play as text-to-speech during the run.<br>
      Keep them short and encouraging. Delivered in order.
    </p>
  </div>

<script>
const URL = "https://7yp3yeisvqkcqg4bis4nhkmtdu0rmwnr.lambda-url.ap-southeast-2.on.aws/";
const $ = (id) => document.getElementById(id);
const sender = $('sender'), message = $('message'), count = $('count'), send = $('send'), status = $('status');

// Persist sender name in localStorage so returning users don't retype
sender.value = localStorage.getItem('sender') || '';
sender.addEventListener('input', () => localStorage.setItem('sender', sender.value));

message.addEventListener('input', () => count.textContent = message.value.length);

send.addEventListener('click', async () => {
  const s = sender.value.trim(), m = message.value.trim();
  if (!s || !m) {
    status.className = 'err';
    status.textContent = 'Fill in your name and a message.';
    return;
  }
  send.disabled = true;
  send.textContent = 'Sending...';
  status.style.display = 'none';
  try {
    const r = await fetch(URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({sender: s, message: m}),
    });
    const data = await r.json();
    if (r.ok) {
      status.className = 'ok';
      status.textContent = '✓ Sent! Nick will hear it soon.';
      message.value = '';
      count.textContent = '0';
    } else {
      status.className = 'err';
      status.textContent = 'Error: ' + (data.error || 'unknown');
    }
  } catch (e) {
    status.className = 'err';
    status.textContent = 'Connection error. Try again.';
  } finally {
    send.disabled = false;
    send.textContent = 'Send message';
  }
});
</script>
</body>
</html>
